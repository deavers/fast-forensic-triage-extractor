<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFTE — Forensic Report Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════ TOKENS ═══════════════════════════ */
:root {
  --font-mono: 'JetBrains Mono', 'Cascadia Code', monospace;
  --font-ui:   'Inter', system-ui, sans-serif;

  --text-xs:   clamp(0.688rem, 0.66rem + 0.14vw, 0.75rem);
  --text-sm:   clamp(0.75rem,  0.72rem + 0.15vw, 0.8125rem);
  --text-base: clamp(0.8125rem,0.78rem + 0.16vw, 0.875rem);
  --text-lg:   clamp(0.9375rem,0.9rem  + 0.19vw, 1rem);
  --text-xl:   clamp(1.0625rem,1rem    + 0.31vw, 1.1875rem);
  --text-2xl:  clamp(1.3125rem,1.2rem  + 0.56vw, 1.5625rem);

  --space-1:.25rem; --space-2:.5rem;  --space-3:.75rem;
  --space-4:1rem;   --space-5:1.25rem;--space-6:1.5rem;
  --space-8:2rem;   --space-10:2.5rem;--space-12:3rem;

  --radius-sm:.25rem; --radius-md:.375rem; --radius-lg:.5rem;
  --radius-xl:.75rem; --radius-full:9999px;

  --ease: cubic-bezier(.16,1,.3,1);
  --t: 150ms;

  /* sidebar */
  --sidebar-w: 228px;
}

/* ─── DARK THEME ─── */
[data-theme="dark"] {
  --bg:          #0b0c0f;
  --surface:     #111318;
  --surface-2:   #161920;
  --surface-3:   #1c2028;
  --surface-4:   #21252f;
  --border:      rgba(255,255,255,.065);
  --border-2:    rgba(255,255,255,.11);
  --text:        #dde0ea;
  --text-2:      #a8adc2;
  --text-3:      #5c6080;
  --text-4:      #363a52;

  --accent:      #3b7eff;
  --accent-dim:  rgba(59,126,255,.14);
  --accent-glow: rgba(59,126,255,.08);

  --green:       #2dd17a;  --green-dim:  rgba(45,209,122,.12);
  --red:         #ff4d4d;  --red-dim:    rgba(255,77,77,.12);
  --yellow:      #f5c542;  --yellow-dim: rgba(245,197,66,.12);
  --orange:      #ff8c42;  --orange-dim: rgba(255,140,66,.12);
  --purple:      #b07eff;  --purple-dim: rgba(176,126,255,.12);
  --cyan:        #2de0d4;  --cyan-dim:   rgba(45,224,212,.12);
  --pink:        #ff6eb4;  --pink-dim:   rgba(255,110,180,.12);

  --shadow-card: 0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
  --shadow-pop:  0 8px 32px rgba(0,0,0,.5);
}

/* ─── LIGHT THEME ─── */
[data-theme="light"] {
  --bg:          #eef0f5;
  --surface:     #ffffff;
  --surface-2:   #f5f6fa;
  --surface-3:   #eceef4;
  --surface-4:   #e4e7ef;
  --border:      rgba(0,0,0,.07);
  --border-2:    rgba(0,0,0,.12);
  --text:        #13151f;
  --text-2:      #4a4f6a;
  --text-3:      #8a90aa;
  --text-4:      #c4c8da;

  --accent:      #2462e8;
  --accent-dim:  rgba(36,98,232,.1);
  --accent-glow: rgba(36,98,232,.06);

  --green:       #0fa854;  --green-dim:  rgba(15,168,84,.1);
  --red:         #e02020;  --red-dim:    rgba(224,32,32,.09);
  --yellow:      #c8960a;  --yellow-dim: rgba(200,150,10,.1);
  --orange:      #d96010;  --orange-dim: rgba(217,96,16,.1);
  --purple:      #7c44d4;  --purple-dim: rgba(124,68,212,.1);
  --cyan:        #0594a8;  --cyan-dim:   rgba(5,148,168,.1);
  --pink:        #c43f88;  --pink-dim:   rgba(196,63,136,.1);

  --shadow-card: 0 1px 2px rgba(0,0,0,.06), 0 3px 12px rgba(0,0,0,.07);
  --shadow-pop:  0 6px 24px rgba(0,0,0,.14);
}

/* ═══════════════════════════ RESET ═══════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:var(--font-ui);font-size:var(--text-base);color:var(--text);background:var(--bg);min-height:100dvh;overflow:hidden}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,select{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:var(--radius-full)}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
::selection{background:var(--accent-dim);color:var(--text)}

/* ═══════════════════════════ LAYOUT ═══════════════════════════ */
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sidebar-inner{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:var(--space-4)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ═══════════════════════════ TOPBAR ═══════════════════════════ */
.topbar{
  height:48px;display:flex;align-items:center;gap:var(--space-3);
  padding:0 var(--space-5);
  background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;
}
.logo-mark{
  display:flex;align-items:center;gap:var(--space-2);flex-shrink:0;
}
.logo-svg{width:28px;height:28px;flex-shrink:0}
.logo-text{font-family:var(--font-mono);font-weight:700;font-size:var(--text-sm);letter-spacing:.04em;color:var(--text)}
.logo-text span{color:var(--accent)}
.topbar-sep{width:1px;height:18px;background:var(--border-2);flex-shrink:0}

.load-btn{
  display:flex;align-items:center;gap:var(--space-2);
  padding:5px var(--space-4);
  background:var(--accent);color:#fff;
  border-radius:var(--radius-lg);font-size:var(--text-sm);font-weight:600;
  transition:opacity var(--t) var(--ease),transform var(--t) var(--ease);
  cursor:pointer;flex-shrink:0;
}
.load-btn:hover{opacity:.88;transform:translateY(-1px)}
.load-btn:active{transform:translateY(0)}
#fileInput{display:none}

.topbar-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-3)}
.meta-pill{
  display:flex;align-items:center;gap:var(--space-2);
  font-size:var(--text-xs);color:var(--text-2);font-family:var(--font-mono);
}
.status-dot{width:6px;height:6px;border-radius:var(--radius-full);background:var(--green);flex-shrink:0;animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.scan-time{color:var(--text-3);font-size:var(--text-xs)}

.icon-btn{
  width:30px;height:30px;border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);border:1px solid var(--border);
  transition:all var(--t) var(--ease);flex-shrink:0;
}
.icon-btn:hover{color:var(--text);background:var(--surface-3);border-color:var(--border-2)}
.icon-btn svg{width:14px;height:14px;display:block}

/* ═══════════════════════════ SIDEBAR ═══════════════════════════ */
.sidebar-top{
  padding:var(--space-3) var(--space-4);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.sidebar-search{
  display:flex;align-items:center;gap:var(--space-2);
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:4px var(--space-3);
  font-size:var(--text-xs);color:var(--text-3);
}
.sidebar-search svg{width:11px;height:11px;flex-shrink:0;color:var(--text-3)}
.sidebar-search input{
  background:none;border:none;outline:none;
  font-size:var(--text-xs);color:var(--text);width:100%;
}
.sidebar-search input::placeholder{color:var(--text-3)}

.nav-group{padding-top:var(--space-3)}
.nav-group-lbl{
  padding:0 var(--space-4) var(--space-1);
  font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-4);
}
.nav-item{
  display:flex;align-items:center;gap:var(--space-2);
  padding:5px var(--space-4);
  font-size:var(--text-sm);color:var(--text-2);
  cursor:pointer;border-left:2px solid transparent;
  transition:all var(--t) var(--ease);user-select:none;
  white-space:nowrap;overflow:hidden;
}
.nav-item:hover{color:var(--text);background:var(--surface-3)}
.nav-item.active{color:var(--accent);background:var(--accent-dim);border-left-color:var(--accent)}
.nav-item.active .ni-icon{color:var(--accent)}
.ni-icon{color:var(--text-3);flex-shrink:0;font-size:12px;width:14px;text-align:center}
.ni-label{flex:1;overflow:hidden;text-overflow:ellipsis}
.ni-count{
  margin-left:auto;flex-shrink:0;
  font-size:9px;font-family:var(--font-mono);font-weight:600;
  color:var(--text-3);background:var(--surface-3);
  padding:1px 5px;border-radius:var(--radius-full);
  transition:all var(--t) var(--ease);
}
.nav-item.active .ni-count{color:var(--accent);background:var(--accent-dim)}
.nav-item.has-data .ni-count{color:var(--text-2)}
.nav-item.threat-item .ni-count{color:var(--red);background:var(--red-dim)}
.nav-item.warn-item  .ni-count{color:var(--yellow);background:var(--yellow-dim)}

/* ═══════════════════════════ CONTENT ═══════════════════════════ */
.content{flex:1;overflow-y:auto;padding:var(--space-6);scroll-padding-top:var(--space-4)}

/* ═══════════════════════════ WELCOME ═══════════════════════════ */
.welcome{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:var(--space-5);text-align:center;color:var(--text-2);
  padding:var(--space-8);
}
.welcome-icon{
  width:72px;height:72px;border-radius:var(--radius-xl);
  background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);font-size:32px;
}
.welcome h2{font-size:var(--text-2xl);font-weight:700;color:var(--text);letter-spacing:-.01em}
.welcome p{font-size:var(--text-sm);max-width:38ch;color:var(--text-2);line-height:1.6}
.welcome code{font-family:var(--font-mono);font-size:.9em;background:var(--surface-3);padding:1px 5px;border-radius:var(--radius-sm)}
.welcome-actions{display:flex;gap:var(--space-3);flex-wrap:wrap;justify-content:center}

/* ═══════════════════════════ KPI GRID ═══════════════════════════ */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));gap:var(--space-3);margin-bottom:var(--space-5)}
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);
  padding:var(--space-4) var(--space-4) var(--space-3);
  display:flex;flex-direction:column;gap:var(--space-1);
  box-shadow:var(--shadow-card);
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease);
}
.kpi:hover{transform:translateY(-1px);box-shadow:var(--shadow-pop)}
.kpi-icon{font-size:16px;margin-bottom:var(--space-1);color:var(--text-3)}
.kpi-val{font-size:var(--text-2xl);font-weight:700;font-family:var(--font-mono);color:var(--text);line-height:1;letter-spacing:-.02em}
.kpi-label{font-size:var(--text-xs);color:var(--text-2);font-weight:500}
.kpi-sub{font-size:10px;color:var(--text-3);font-family:var(--font-mono);margin-top:var(--space-1)}
.kpi.danger{border-color:var(--red);background:var(--red-dim)}
.kpi.danger .kpi-val,.kpi.danger .kpi-icon{color:var(--red)}
.kpi.warn{border-color:var(--yellow);background:var(--yellow-dim)}
.kpi.warn .kpi-val,.kpi.warn .kpi-icon{color:var(--yellow)}
.kpi.ok{border-color:var(--green);background:var(--green-dim)}
.kpi.ok .kpi-val,.kpi.ok .kpi-icon{color:var(--green)}
.kpi.info{border-color:var(--accent);background:var(--accent-dim)}
.kpi.info .kpi-val,.kpi.info .kpi-icon{color:var(--accent)}

/* ═══════════════════════════ INFO CARDS ═══════════════════════════ */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:var(--space-3);margin-bottom:var(--space-5)}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);
  padding:var(--space-4);box-shadow:var(--shadow-card);
}
.card-title{
  font-size:var(--text-xs);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-3);
  margin-bottom:var(--space-3);padding-bottom:var(--space-2);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:var(--space-2);
}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-4);padding:4px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row-k{font-size:var(--text-xs);color:var(--text-2);white-space:nowrap;flex-shrink:0;padding-top:1px}
.row-v{font-size:var(--text-xs);font-family:var(--font-mono);color:var(--text);text-align:right;word-break:break-all;flex:1;min-width:0}

/* ═══════════════════════════ SECTION ═══════════════════════════ */
.section-bar{
  display:flex;align-items:center;gap:var(--space-3);
  margin-bottom:var(--space-4);flex-wrap:wrap;
}
.section-title{font-size:var(--text-xl);font-weight:700;color:var(--text);letter-spacing:-.01em}
.section-badge{
  font-family:var(--font-mono);font-size:10px;font-weight:700;
  padding:2px 7px;background:var(--surface-3);border-radius:var(--radius-full);color:var(--text-2);
}
.filter-row{display:flex;align-items:center;gap:var(--space-2);margin-left:auto;flex-wrap:wrap}
.search-input{
  display:flex;align-items:center;gap:var(--space-2);
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:5px var(--space-3);
  transition:border-color var(--t) var(--ease);
}
.search-input:focus-within{border-color:var(--border-2)}
.search-input svg{width:12px;height:12px;color:var(--text-3);flex-shrink:0}
.search-input input{background:none;border:none;outline:none;font-size:var(--text-sm);color:var(--text);width:180px}
.search-input input::placeholder{color:var(--text-3)}
.export-btn{
  display:flex;align-items:center;gap:var(--space-2);
  padding:5px var(--space-3);font-size:var(--text-xs);font-weight:500;
  border:1px solid var(--border);border-radius:var(--radius-lg);color:var(--text-2);
  transition:all var(--t) var(--ease);
}
.export-btn:hover{color:var(--text);background:var(--surface-3);border-color:var(--border-2)}
.export-btn svg{width:12px;height:12px}

/* ═══════════════════════════ TABLE ═══════════════════════════ */
.tbl-wrap{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);
  overflow:hidden;box-shadow:var(--shadow-card);
}
.tbl-scroll{overflow:auto;max-height:calc(100dvh - 210px)}
.ffte-tbl{font-size:var(--text-xs);min-width:100%}
.ffte-tbl thead th{
  position:sticky;top:0;z-index:10;
  background:var(--surface-2);padding:var(--space-3) var(--space-4);
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-2);text-align:left;white-space:nowrap;
  border-bottom:1px solid var(--border-2);cursor:pointer;
  user-select:none;transition:color var(--t) var(--ease);
}
.ffte-tbl thead th:hover{color:var(--text)}
.ffte-tbl thead th .sort-icon{margin-left:4px;opacity:.4;font-size:9px}
.ffte-tbl thead th.sorted .sort-icon{opacity:1;color:var(--accent)}
.ffte-tbl tbody tr{border-bottom:1px solid var(--border);transition:background var(--t) var(--ease)}
.ffte-tbl tbody tr:last-child{border-bottom:none}
.ffte-tbl tbody tr:hover{background:var(--surface-3)}
.ffte-tbl td{
  padding:var(--space-2) var(--space-4);
  font-family:var(--font-mono);color:var(--text);
  vertical-align:middle;max-width:380px;word-break:break-all;
}
.ffte-tbl td.col-nowrap{white-space:nowrap;max-width:none}
.ffte-tbl td.col-dim{color:var(--text-2)}
.ffte-tbl td.col-faint{color:var(--text-3)}
.ffte-tbl .no-data{text-align:center;padding:var(--space-12) var(--space-6);color:var(--text-3);font-family:var(--font-ui)}
.tbl-footer{
  padding:var(--space-2) var(--space-4);background:var(--surface-2);
  border-top:1px solid var(--border);font-size:var(--text-xs);
  color:var(--text-3);display:flex;align-items:center;justify-content:space-between;
  font-family:var(--font-mono);
}

/* code block for multi-line content */
.code-block{
  font-family:var(--font-mono);font-size:10px;
  color:var(--text-2);white-space:pre-wrap;word-break:break-all;
  padding:var(--space-2) var(--space-3);max-height:100px;overflow-y:auto;
  background:var(--surface-2);border-radius:var(--radius-md);
  border:1px solid var(--border);line-height:1.5;
}
.code-block::-webkit-scrollbar{width:3px}

/* ═══════════════════════════ PILLS ═══════════════════════════ */
.pill{
  display:inline-flex;align-items:center;gap:3px;
  padding:1px 7px;border-radius:var(--radius-full);
  font-size:10px;font-weight:700;white-space:nowrap;font-family:var(--font-ui);
}
.pill.green  {background:var(--green-dim);  color:var(--green)}
.pill.red    {background:var(--red-dim);    color:var(--red)}
.pill.yellow {background:var(--yellow-dim); color:var(--yellow)}
.pill.orange {background:var(--orange-dim); color:var(--orange)}
.pill.blue   {background:var(--accent-dim); color:var(--accent)}
.pill.cyan   {background:var(--cyan-dim);   color:var(--cyan)}
.pill.purple {background:var(--purple-dim); color:var(--purple)}
.pill.pink   {background:var(--pink-dim);   color:var(--pink)}
.pill.gray   {background:var(--surface-3);  color:var(--text-2)}

/* ═══════════════════════════ ALERT BANNER ═══════════════════════════ */
.alert-banner{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) var(--space-4);border-radius:var(--radius-xl);
  font-size:var(--text-sm);font-weight:500;margin-bottom:var(--space-4);
  border:1px solid;
}
.alert-banner.danger{background:var(--red-dim);color:var(--red);border-color:rgba(255,77,77,.3)}
.alert-banner.warn{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(245,197,66,.3)}
.alert-banner.ok{background:var(--green-dim);color:var(--green);border-color:rgba(45,209,122,.3)}
.alert-banner-icon{font-size:18px;flex-shrink:0}
.alert-banner-text strong{display:block;margin-bottom:2px}
.alert-banner-text span{font-size:var(--text-xs);font-weight:400;opacity:.8}

/* ═══════════════════════════ MISC ═══════════════════════════ */
.mt-4{margin-top:var(--space-4)}
.mb-4{margin-bottom:var(--space-4)}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--space-10) var(--space-6);gap:var(--space-2);
  color:var(--text-3);font-size:var(--text-sm);text-align:center;
}
.empty-state-icon{font-size:32px;margin-bottom:var(--space-2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* no data placeholders inside table vs section */
.section-empty{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-xl);box-shadow:var(--shadow-card);
}

/* ═══════════════════════════ RESPONSIVE ═══════════════════════════ */
@media(max-width:680px){
  :root{--sidebar-w:0px}
  .sidebar{position:fixed;left:-240px;top:0;bottom:0;z-index:100;width:240px;transition:left .25s var(--ease)}
  .sidebar.open{left:0}
  .content{padding:var(--space-4) var(--space-3)}
}
</style>
</head>
<body>
<div class="app">

  <nav class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="sidebar-top">
      <div class="sidebar-search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="4.5"/><path d="m11 11 2.5 2.5"/></svg>

<script>
'use strict';

/* ═══════════════════════════ GLOBALS ═══════════════════════════ */
let G = null;          // full parsed json
let currentSection = null;
let sortState = {};    // {sectionId: {col, dir}}

/* ═══════════════════════════ THEME ═══════════════════════════ */
(function () {
  const root = document.documentElement;
  const btn  = document.getElementById('themeToggle');
  const icon = document.getElementById('themeIcon');
  let   dark = true;

  const moonSVG = `<path d="M12 3a6.364 6.364 0 0 0 9 9 9 9 0 1 1-9-9z" fill="currentColor" stroke="none"/>`;
  const sunSVG  = `<path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41"/><circle cx="8" cy="8" r="3"/>`;

  function apply() {
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    icon.innerHTML = dark ? moonSVG : sunSVG;
    btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  apply();
  btn.addEventListener('click', () => { dark = !dark; apply(); });
})();

/* ═══════════════════════════ HELPERS ═══════════════════════════ */
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function pill(text, color) {
  return `<span class="pill ${color}">${esc(String(text))}</span>`;
}
function na(v) {
  if (v === null || v === undefined || v === '') return `<span style="color:var(--text-3)">—</span>`;
  return esc(String(v));
}
function bool(v) {
  return v ? pill('YES', 'red') : pill('NO', 'green');
}
function boolInv(v) {
  return v ? pill('YES', 'green') : pill('NO', 'red');
}
function codeBlock(text, maxLines) {
  if (!text) return `<span style="color:var(--text-3)">—</span>`;
  const lines = String(text).replace(/\\0/g, '\n').replace(/; /g, '\n').trim().split('\n').filter(Boolean);
  const show = maxLines ? lines.slice(0, maxLines) : lines;
  const overflow = maxLines && lines.length > maxLines ? `\n… +${lines.length - maxLines} more` : '';
  return `<div class="code-block">${esc(show.join('\n') + overflow)}</div>`;
}
function netState(s) {
  const map = {ESTABLISHED:'green',LISTEN:'blue',TIME_WAIT:'yellow',CLOSE_WAIT:'orange',SYN_SENT:'cyan',CLOSE:'gray'};
  return pill(s || '?', map[s] || 'gray');
}
function signatureStatus(valid) {
  return valid ? pill('✓ SIGNED', 'green') : pill('⚠ UNSIGNED', 'red');
}
function protectionBadge(p) {
  if (!p) return na(p);
  const high = ['RWX','PAGE_EXECUTE_READWRITE','PAGE_EXECUTE_READ','EXECUTE'];
  const isHigh = high.some(h => p.toUpperCase().includes(h));
  return pill(p, isHigh ? 'red' : 'orange');
}

/* ═══════════════════════════ NAV CONFIG ═══════════════════════════ */
const NAV = [
  { group: 'Overview',          items: [
    { id:'dashboard',   label:'Dashboard',           icon:'⊞' },
  ]},
  { group: 'Processes & Memory', items: [
    { id:'processes',   label:'Processes',           icon:'⚙' },
    { id:'memory',      label:'Injected Memory',     icon:'⚠', threat:true },
    { id:'clipboard',   label:'Clipboard Data',      icon:'📋' },
  ]},
  { group: 'Network',           items: [
    { id:'network',     label:'Connections',         icon:'⇆' },
    { id:'dns',         label:'DNS Cache',           icon:'🔍' },
    { id:'arp',         label:'ARP Table',           icon:'🔗' },
    { id:'firewall',    label:'Firewall Rules',      icon:'🛡' },
    { id:'bluetooth',   label:'Bluetooth Devices',   icon:'📶' },
    { id:'hosts',       label:'Hosts File',          icon:'🌐' },
  ]},
  { group: 'Persistence & OS',  items: [
    { id:'persistence', label:'Autorun / Registry',  icon:'🔁', threat:true },
    { id:'services',    label:'Services & Drivers',  icon:'⚙' },
    { id:'tasks',       label:'Cron / Sched Tasks',  icon:'⏱' },
    { id:'systemfiles', label:'System Files',        icon:'🗄' },
    { id:'prefetch',    label:'Prefetch Files',      icon:'📄' },
    { id:'useractivity',label:'User Activity',       icon:'📊' },
  ]},
  { group: 'Browser & Web',     items: [
    { id:'browser',     label:'Browser History',     icon:'🌍' },
    { id:'extensions',  label:'Browser Extensions',  icon:'🧩' },
  ]},
  { group: 'Security Logs',     items: [
    { id:'eventlogs',   label:'Event Logs',          icon:'⚡', threat:true },
    { id:'rdp',         label:'RDP Sessions',        icon:'🖥' },
    { id:'usb',         label:'USB History',         icon:'🔌' },
  ]},
  { group: 'Linux Specific',    items: [
    { id:'lkm',         label:'Kernel Modules',      icon:'🐧', threat:true },
    { id:'procfds',     label:'Open Files (FDs)',    icon:'📁' },
    { id:'procenvs',    label:'Environments',        icon:'🌱' },
    { id:'proccreds',   label:'Process Creds',       icon:'👤' },
    { id:'proccgroups', label:'Control Groups',      icon:'📦' },
    { id:'systemd',     label:'Systemd Units',       icon:'⚙' },
    { id:'ssh',         label:'SSH Keys',            icon:'🔑' },
    { id:'packages',    label:'Packages',            icon:'📦' },
  ]},
];

/* ─── ПОДГОНКА ПУТЕЙ ДАННЫХ ПОД СТРУКТУРУ C++ EXPORTER ─── */
function getSectionData(id) {
  if (!G || !G.artifacts) return [];
  const arts = G.artifacts || {};
  const df = arts.digital_footprint || {};

  const map = {
    processes:    () => arts.processes || [],
    memory:       () => df.injected_memory || [],
    clipboard:    () => df.clipboard_triage || [],
    network:      () => df.network_connections || [],
    dns:          () => df.dns_cache || [],
    arp:          () => df.arp_entries || [],
    firewall:     () => df.firewall_rules || [],
    bluetooth:    () => df.bluetooth_history || [],
    hosts:        () => df.hosts_lines || [],
    persistence:  () => arts.persistence || [],
    services:     () => arts.services_and_drivers || [],
    tasks:        () => df.scheduled_tasks || [],
    systemfiles:  () => df.system_files || [],
    prefetch:     () => df.prefetch_files || [],
    useractivity: () => df.user_activity || [],
    browser:      () => df.browser_history || [],
    extensions:   () => df.browser_extensions || [],
    eventlogs:    () => df.event_logs || [],
    rdp:          () => df.rdp_sessions || [],
    usb:          () => df.usb_history || [],
    // Linux Specific Accessors matching Exporter.cpp
    lkm:          () => df.linux_modules || [],
    procfds:      () => df.process_open_files || [],
    procenvs:     () => df.process_environments || [],
    proccreds:    () => df.process_credentials || [],
    proccgroups:  () => df.process_cgroups || [],
    systemd:      () => df.systemd_units || [],
    ssh:          () => df.ssh_keys || [],
    packages:     () => df.installed_packages || [],
  };
  return map[id] ? map[id]() : [];
}

/* ═══════════════════════════ FILE LOAD ═══════════════════════════ */
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    let parsed = null;
    try { 
      parsed = JSON.parse(ev.target.result); 
    } catch { 
      alert('Invalid JSON — file may be corrupted.'); 
      return; 
    }
    G = parsed;
    try { 
      initViewer(); 
    } catch (err) { 
      console.error(err); 
      alert('Error rendering viewer:\n' + err.message); 
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // Сброс инпута для бесконечной повторной загрузки
});

/* ═══════════════════════════ INIT VIEWER ═══════════════════════════ */
function initViewer() {
  document.getElementById('welcomeScreen').style.display = 'none';

  const arts = G.artifacts || {};
  const df = arts.digital_footprint || {};

  /* topbar meta */
  document.getElementById('scanMeta').style.display = 'flex';
  const host = df.os_info?.name || G.metadata?.tool_name || 'Target Machine';
  document.getElementById('scanHost').textContent = host.slice(0, 30);
  const ts = G.metadata?.scan_timestamp || 'Just Now';
  document.getElementById('scanTime').textContent = ts ? '· ' + ts : '';

  buildSidebar();
  showSection('dashboard');
}

/* ═══════════════════════════ SIDEBAR BUILD ═══════════════════════════ */
function buildSidebar() {
  const container = document.getElementById('sidebarInner');
  container.innerHTML = '';

  for (const group of NAV) {
    const groupEl = document.createElement('div');
    groupEl.className = 'nav-group';

    const lbl = document.createElement('div');
    lbl.className = 'nav-group-lbl';
    lbl.textContent = group.group;
    groupEl.appendChild(lbl);

    for (const item of group.items) {
      const count = item.id === 'dashboard' ? null : getSectionData(item.id).length;
      const el = document.createElement('div');
      el.className = 'nav-item';
      el.dataset.section = item.id;
      el.dataset.label = (item.label + ' ' + item.id).toLowerCase();

      if (count !== null && count > 0) el.classList.add('has-data');
      if (item.threat && count > 0) el.classList.add('threat-item');

      el.innerHTML = `
        <span class="ni-icon">${item.icon}</span>
        <span class="ni-label">${item.label}</span>
        ${count !== null ? `<span class="ni-count">${count}</span>` : ''}
      `;
      el.addEventListener('click', () => showSection(item.id));
      groupEl.appendChild(el);
    }
    container.appendChild(groupEl);
  }

  /* nav filter */
  document.getElementById('navSearch').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.nav-item[data-label]').forEach(el => {
      el.style.display = el.dataset.label.includes(q) ? '' : 'none';
    });
    document.querySelectorAll('.nav-group-lbl').forEach(lbl => {
      const visible = [...lbl.parentElement.querySelectorAll('.nav-item')].some(el => el.style.display !== 'none');
      lbl.style.display = visible ? '' : 'none';
    });
  });
}

/* ═══════════════════════════ SHOW SECTION ═══════════════════════════ */
function showSection(id) {
  currentSection = id;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.section === id));
  const content = document.getElementById('content');

  const renders = {
    dashboard:   renderDashboard,
    processes:   () => renderProcesses(getSectionData('processes')),
    memory:      () => renderInjectedMemory(getSectionData('memory')),
    clipboard:   () => renderClipboard(getSectionData('clipboard')),
    network:     () => renderNetwork(getSectionData('network')),
    dns:         () => renderDNS(getSectionData('dns')),
    arp:         () => renderARP(getSectionData('arp')),
    firewall:    () => renderFirewall(getSectionData('firewall')),
    bluetooth:   () => renderBluetooth(getSectionData('bluetooth')),
    hosts:       () => renderHosts(getSectionData('hosts')),
    persistence: () => renderPersistence(getSectionData('persistence')),
    services:    () => renderServices(getSectionData('services')),
    tasks:       () => renderTasks(getSectionData('tasks')),
    systemfiles: () => renderSystemFiles(getSectionData('systemfiles')),
    prefetch:    () => renderPrefetch(getSectionData('prefetch')),
    useractivity:() => renderUserActivity(getSectionData('useractivity')),
    browser:     () => renderBrowserHistory(getSectionData('browser')),
    extensions:  () => renderExtensions(getSectionData('extensions')),
    eventlogs:   () => renderEventLogs(getSectionData('eventlogs')),
    rdp:         () => renderRDP(getSectionData('rdp')),
    usb:         () => renderUSB(getSectionData('usb')),
    lkm:         () => renderLKM(getSectionData('lkm')),
    procfds:     () => renderProcFDs(getSectionData('procfds')),
    procenvs:    () => renderProcEnvs(getSectionData('procenvs')),
    proccreds:   () => renderProcCreds(getSectionData('proccreds')),
    proccgroups: () => renderProcCgroups(getSectionData('proccgroups')),
    systemd:     () => renderSystemd(getSectionData('systemd')),
    ssh:         () => renderSSH(getSectionData('ssh')),
    packages:    () => renderPackages(getSectionData('packages')),
  };

  content.innerHTML = (renders[id] ? renders[id]() : '<div class="empty-state"><div>Section not found</div></div>');
  content.scrollTop = 0;
  initSortHandlers();
}

/* ═══════════════════════════ TABLE HELPERS ═══════════════════════════ */
function makeTable(id, cols, rows) {
  if (!rows.length) {
    return `<div class="section-empty"><div class="empty-state"><div class="empty-state-icon">📭</div><div>0 records found for this artifact.</div></div></div>`;
  }
  const ths = cols.map((c, i) =>
    `<th data-col="${i}" data-id="${id}">${c} <span class="sort-icon">↕</span></th>`
  ).join('');
  const trs = rows.join('');
  return `
<div class="tbl-wrap">
  <div class="tbl-scroll">
    <table class="ffte-tbl" id="tbl-${id}">
      <thead><tr>${ths}</tr></thead>
      <tbody id="tbody-${id}">${trs}</tbody>
    </table>
  </div>
  <div class="tbl-footer">
    <span id="tbl-count-${id}">${rows.length} record${rows.length !== 1 ? 's' : ''}</span>
    <button class="export-btn" onclick="exportCSV('${id}')">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v9M4 8l4 4 4-4"/><path d="M2 13h12"/></svg>
      Export CSV
    </button>
  </div>
</div>`;
}

function sectionShell(title, icon, count, searchId, inner) {
  const searchHtml = searchId ? `
    <div class="filter-row">
      <div class="search-input">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="4.5"/><path d="m11 11 2.5 2.5"/></svg>
        <input type="text" placeholder="Search…" oninput="filterTable('${searchId}',this.value)" aria-label="Filter table">
      </div>
    </div>` : '';
  return `
<div class="section-bar">
  <div class="section-title">${icon} ${title}</div>
  <span class="section-badge">${count}</span>
  ${searchHtml}
</div>
${inner}`;
}

function filterTable(id, q) {
  const tbody = document.getElementById('tbody-' + id);
  if (!tbody) return;
  const term = q.toLowerCase();
  let vis = 0;
  tbody.querySelectorAll('tr').forEach(tr => {
    const match = tr.textContent.toLowerCase().includes(term);
    tr.style.display = match ? '' : 'none';
    if (match) vis++;
  });
  const c = document.getElementById('tbl-count-' + id);
  if (c) c.textContent = `${vis} record${vis !== 1 ? 's' : ''}`;
}

function initSortHandlers() {
  document.querySelectorAll('.ffte-tbl thead th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = parseInt(th.dataset.col);
      const id  = th.dataset.id;
      if (!sortState[id]) sortState[id] = { col: -1, dir: 'asc' };
      const s = sortState[id];
      if (s.col === col) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
      else { s.col = col; s.dir = 'asc'; }

      const tbody = document.getElementById('tbody-' + id);
      if (!tbody) return;
      const rows = [...tbody.querySelectorAll('tr')];
      rows.sort((a, b) => {
        const ta = a.cells[col]?.textContent.trim() || '';
        const tb = b.cells[col]?.textContent.trim() || '';
        const n = parseFloat(ta) - parseFloat(tb);
        const cmp = isNaN(n) ? ta.localeCompare(tb) : n;
        return s.dir === 'asc' ? cmp : -cmp;
      });
      rows.forEach(r => tbody.appendChild(r));

      document.querySelectorAll(`th[data-id="${id}"]`).forEach((h, i) => {
        h.classList.toggle('sorted', i === col);
        const icon = h.querySelector('.sort-icon');
        if (icon) icon.textContent = i === col ? (s.dir === 'asc' ? '↑' : '↓') : '↕';
      });
    });
  });
}

/* ═══════════════════════════ CSV EXPORT ═══════════════════════════ */
function exportCSV(id) {
  const tbl = document.getElementById('tbl-' + id);
  if (!tbl) return;
  const rows = [];
  const headers = [...tbl.querySelectorAll('thead th')].map(th => `"${th.textContent.replace(/[↕↑↓]/g,'').trim()}"`);
  rows.push(headers.join(','));
  tbl.querySelectorAll('tbody tr').forEach(tr => {
    if (tr.style.display === 'none') return;
    const cells = [...tr.cells].map(td => `"${td.textContent.replace(/"/g,'""').trim()}"`);
    rows.push(cells.join(','));
  });
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ffte_${id}_${Date.now()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ═══════════════════════════ RENDERERS ═══════════════════════════ */

/* ── DASHBOARD ── */
function renderDashboard() {
  const arts     = G.artifacts || {};
  const df       = arts.digital_footprint || {};
  
  const memory   = df.injected_memory || [];
  const events   = df.event_logs || [];
  const persist  = arts.persistence || [];
  const procs    = arts.processes || [];
  const net      = df.network_connections || [];
  const lkm      = df.linux_modules || [];

  const threatHigh = memory.length > 0 || lkm.length > 0;
  const threatMed  = events.length > 0 || persist.length > 0;
  const threatClass = threatHigh ? 'danger' : threatMed ? 'warn' : 'ok';
  const threatLabel = threatHigh ? '⚠ HIGH RISK' : threatMed ? '⚡ MEDIUM' : '✓ CLEAN';
  const threatMsg   = threatHigh
    ? `${memory.length} memory injection(s) detected`
    : threatMed
      ? `${events.length} event(s), ${persist.length} persistence entries`
      : 'No critical anomalies found';

  const vpn = df.anonymity?.isVpnActive ? '<span class="pill orange">VPN ACTIVE</span>' : '';
  const proxy = df.anonymity?.isProxyActive ? '<span class="pill yellow">PROXY ACTIVE</span>' : '';

  const alert = `<div class="alert-banner ${threatClass}">
    <span class="alert-banner-icon">${threatHigh ? '🔴' : threatMed ? '🟡' : '🟢'}</span>
    <div class="alert-banner-text"><strong>${threatLabel}</strong><span>${threatMsg}</span></div>
    ${vpn}${proxy}
  </div>`;

  const kpis = `<div class="kpi-grid">
    <div class="kpi ${threatClass}">
      <div class="kpi-icon">${threatHigh ? '⚠' : '🛡'}</div>
      <div class="kpi-val">${threatLabel}</div>
      <div class="kpi-label">Threat Level</div>
      <div class="kpi-sub">${threatMsg}</div>
    </div>
    <div class="kpi ${procs.length > 0 ? 'info' : ''}">
      <div class="kpi-icon">⚙</div>
      <div class="kpi-val">${procs.length}</div>
      <div class="kpi-label">Processes</div>
      <div class="kpi-sub">${procs.filter(p=>p.isElevated).length} elevated</div>
    </div>
    <div class="kpi ${net.length > 0 ? 'info' : ''}">
      <div class="kpi-icon">⇆</div>
      <div class="kpi-val">${net.length}</div>
      <div class="kpi-label">Net Connections</div>
      <div class="kpi-sub">${net.filter(c=>c.state==='ESTABLISHED').length} established</div>
    </div>
    <div class="kpi ${memory.length > 0 ? 'danger' : ''}">
      <div class="kpi-icon">⚡</div>
      <div class="kpi-val">${memory.length}</div>
      <div class="kpi-label">Injected Memory</div>
      <div class="kpi-sub">RWX anomalies</div>
    </div>
    <div class="kpi ${persist.length > 0 ? 'warn' : ''}">
      <div class="kpi-icon">🔁</div>
      <div class="kpi-val">${persist.length}</div>
      <div class="kpi-label">Persistence</div>
      <div class="kpi-sub">Autorun entries</div>
    </div>
    <div class="kpi">
      <div class="kpi-icon">🌍</div>
      <div class="kpi-val">${(df.browser_history||[]).length}</div>
      <div class="kpi-label">Browser History</div>
      <div class="kpi-sub">URLs collected</div>
    </div>
  </div>`;

  const os = df.os_info || {};
  const hw = df.hw_info || {};
  const loc = df.location || {};
  const anon = df.anonymity || {};

  const info = `<div class="info-grid">
    <div class="card">
      <div class="card-title">🖥 System Identity</div>
      <div class="row"><span class="row-k">OS</span><span class="row-v">${na(os.name)}</span></div>
      <div class="row"><span class="row-k">Install Date</span><span class="row-v">${na(os.install_date)}</span></div>
      <div class="row"><span class="row-k">Boot Time</span><span class="row-v">${na(os.boot_time)}</span></div>
    </div>
    <div class="card">
      <div class="card-title">💻 Hardware</div>
      <div class="row"><span class="row-k">CPU</span><span class="row-v">${na(hw.cpuName)}</span></div>
      <div class="row"><span class="row-k">GPU</span><span class="row-v">${na(hw.gpuName)}</span></div>
      <div class="row"><span class="row-k">RAM</span><span class="row-v">${na(hw.totalRamGB)}</span></div>
      <div class="row"><span class="row-k">Board Serial</span><span class="row-v">${na(hw.motherboardSerial)}</span></div>
    </div>
    <div class="card">
      <div class="card-title">📍 Location &amp; Anonymity</div>
      <div class="row"><span class="row-k">Source</span><span class="row-v">${na(loc.source)}</span></div>
      <div class="row"><span class="row-k">Lat / Lon</span><span class="row-v">${loc.latitude ? loc.latitude + ' / ' + loc.longitude : '—'}</span></div>
      <div class="row"><span class="row-k">VPN Active</span><span class="row-v">${bool(anon.isVpnActive)}</span></div>
      <div class="row"><span class="row-k">Proxy Active</span><span class="row-v">${bool(anon.isProxyActive)}</span></div>
      <div class="row"><span class="row-k">Adapters</span><span class="row-v">${na(anon.activeAdapters)}</span></div>
    </div>
    <div class="card">
      <div class="card-title">📊 Artifact Counts</div>
      ${[
        ['Processes', procs.length],
        ['Net Connections', net.length],
        ['DNS Cache', (df.dns_cache||[]).length],
        ['Browser History', (df.browser_history||[]).length],
        ['Persistence', persist.length],
        ['Event Logs', events.length],
        ['USB Devices', (df.usb_history||[]).length],
        ['Linux Modules', lkm.length],
        ['Packages', (df.installed_packages||[]).length],
      ].map(([k,v]) => `<div class="row"><span class="row-k">${k}</span><span class="row-v">${v}</span></div>`).join('')}
    </div>
  </div>`;

  return alert + kpis + info;
}

/* ── PROCESSES ── */
function renderProcesses(data) {
  const rows = data.map(p => `<tr>
    <td class="col-nowrap" style="font-weight:600">${esc(p.pid)}</td>
    <td class="col-dim">${esc(p.ppid)}</td>
    <td style="font-weight:600">${esc(p.name)}</td>
    <td class="col-dim">${na(p.exePath)}</td>
    <td class="col-nowrap">${p.memoryKB ? (p.memoryKB/1024).toFixed(1)+' MB' : '—'}</td>
    <td>${p.isElevated !== undefined ? bool(p.isElevated) : '—'}</td>
    <td>${p.isSignatureValid !== undefined ? signatureStatus(p.isSignatureValid) : '—'}</td>
  </tr>`);
  return sectionShell('Processes', '⚙', data.length, 'processes',
    makeTable('processes', ['PID','PPID','Name','Exe Path','Memory','Elevated','Signature'], rows));
}

/* ── INJECTED MEMORY ── */
function renderInjectedMemory(data) {
  const alert = data.length ? `<div class="alert-banner danger mb-4">
    <span class="alert-banner-icon">🔴</span>
    <div class="alert-banner-text"><strong>Memory Injection Detected</strong><span>${data.length} process(es) with suspicious RWX memory regions</span></div>
  </div>` : '';
  const rows = data.map(m => `<tr>
    <td class="col-nowrap" style="font-weight:600">${esc(m.pid)}</td>
    <td style="font-weight:600">${esc(m.processName)}</td>
    <td style="font-family:var(--font-mono)">${esc(m.memoryAddress)}</td>
    <td>${protectionBadge(m.protection)}</td>
  </tr>`);
  return alert + sectionShell('Injected Memory (RWX Scanner)', '⚠', data.length, 'memory',
    makeTable('memory', ['PID','Process Name','Memory Address','Protection'], rows));
}

  const rows = data.map(c => `<tr>

    <td class="col-dim">${na(c.sizeBytes)}</td>

  </tr>`);
  return sectionShell('Clipboard Data', '📋', data.length, null,
    makeTable('clipboard', ['Format','Size (bytes)','Content'], rows));
}

function renderPersistence(data) {

/* ── BROWSER HISTORY ── */
function renderBrowserHistory(data) {
  const rows = data.map(b => {
    const bcolor = {Firefox:'orange',MozillaFirefox:'orange',Chrome:'green',Edge:'blue',Other:'gray'}[b.browser] || 'gray';
    const urlEsc = esc(b.url || '');
    const titleEsc = esc(b.title || b.url || '');
    return `<tr>
      <td class="col-nowrap">${pill(b.browser || '?', bcolor)}</td>
      <td style="max-width:320px"><a href="${urlEsc}" target="_blank" rel="noopener noreferrer" title="${urlEsc}">${titleEsc}</a></td>
      <td class="col-nowrap col-dim">${na(b.visitCount)}</td>
      <td class="col-nowrap col-dim">${na(b.lastVisitTime)}</td>
    </tr>`;
  });
  return sectionShell('Browser History', '🌍', data.length, 'browser',
    makeTable('browser', ['Browser','Title / URL','Visits','Last Visit'], rows));
}

function renderExtensions(data) {
